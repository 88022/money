<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои деньги</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Мои деньги">
<meta name="theme-color" content="#f2f5f9">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f2f5f9;--card:#fff;--ink:#0f2742;--ink2:#5b6f86;--line:#e3e9f0;--acc:#1f6fd1;--acc-soft:#e4effc;--good:#1a8f5a;--good-soft:#e2f5ec;--bad:#d9412c;--bad-soft:#fde8e5;--warn:#b07800;--warn-soft:#fdf3dc}
@media (prefers-color-scheme:dark){:root{--bg:#0d1520;--card:#17212e;--ink:#e8eef5;--ink2:#93a4b8;--line:#263445;--acc:#5aa2ff;--acc-soft:#1b3050;--good:#45c98a;--good-soft:#173528;--bad:#ff7a68;--bad-soft:#3d1f1b;--warn:#f0b43c;--warn-soft:#3a2e14}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 96px)}
h1{font-size:28px;margin:6px 0 14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);margin:22px 4px 8px;font-weight:600}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.hero{padding:18px 16px}
.hero .lbl{color:var(--ink2);font-size:14px}
.hero .big{font-size:36px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .l{min-width:0}.row .l small{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
.row .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.tap{cursor:pointer}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin-left:6px}
.p-bad{background:var(--bad-soft);color:var(--bad)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-ok{background:var(--good-soft);color:var(--good)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 14px;font:600 16px inherit;font-family:inherit;background:var(--acc);color:#fff;cursor:pointer}
.btn.sec{background:var(--acc-soft);color:var(--acc)}.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.wide{width:100%}.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ops{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ops button{border:0;background:var(--card);color:var(--ink);border-radius:14px;padding:12px 6px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.ops button b{display:block;font-size:20px;margin-bottom:2px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav div{display:flex;max-width:560px;width:100%}
nav button{flex:1;border:0;background:none;color:var(--ink2);font:500 11px inherit;font-family:inherit;padding:8px 0 6px;cursor:pointer}
nav button b{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--acc)}
.muted{color:var(--ink2);font-size:14px}
.empty{color:var(--ink2);text-align:center;padding:16px 0}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:9}
#sheet.on{display:flex}
#sheet .in{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow:auto}
#sheet h3{margin:0 0 12px;font-size:20px}
label{display:block;font-size:13px;color:var(--ink2);margin:10px 2px 4px}
input,select{width:100%;font:17px inherit;font-family:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);-webkit-appearance:none}
.sw{display:flex;align-items:center;justify-content:space-between}
.sw input{width:auto;transform:scale(1.3)}
.hint{font-size:13px;color:var(--ink2);margin:8px 2px}
.quick{display:flex;gap:8px;margin:0 0 12px}.quick input{flex:1}.quick .btn{padding:0 18px;font-size:20px}
.qrow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:15px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:10}
.toast.on{opacity:.95}
</style>
</head>
<body>
<main id="app"></main>
<nav><div>
 <button data-t="home" class="on"><b>◉</b>Главная</button>
 <button data-t="cards"><b>▭</b>Кредитки</button>
 <button data-t="env"><b>✉</b>Конверты</button>
 <button data-t="plan"><b>☰</b>План</button>
 <button data-t="more"><b>⋯</b>Ещё</button>
</div></nav>
<div id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const KEY = "money-app-v1";
const blank = () => ({
  balance: 0,
  banks: [{id: uid(), name: "Банк 1", rate: 12, on: true}],
  cards: [], plan: [], envelopes: [], other: [],
  loan: {name: "Кредит", payment: 0, day: 1, left: 0, paid: "", principal: 0, rate: 0},
  log: []
});
function uid(){ return Math.random().toString(36).slice(2, 9); }
let S, tab = "home";
function load(){
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) { S = null; }
  if (!S) S = blank();
  const b = blank();
  for (const k in b) if (S[k] === undefined) S[k] = b[k];
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) { toast("Не удалось сохранить"); } }
function log(text, delta){ S.log.unshift({t: new Date().toISOString(), text, delta}); S.log = S.log.slice(0, 300); }

// ---------- форматирование ----------
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rub(x, sign){
  const v = Math.round((+x || 0) * 100) / 100;
  let s = Math.abs(v).toLocaleString("ru-RU", {minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2});
  return (v < 0 ? "−" : sign && v > 0 ? "+" : "") + s + " ₽";
}
const num = s => { const v = parseFloat(String(s).replace(/\s/g, "").replace(",", ".")); return isNaN(v) ? 0 : v; };
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const dmy = s => s ? s.slice(8,10) + "." + s.slice(5,7) : "—";
const daysTo = s => Math.round((new Date(s + "T00:00:00") - today()) / 864e5);
function pill(s){
  if (!s) return "";
  const n = daysTo(s);
  if (n < 0) return `<span class="pill p-bad">просрочено</span>`;
  if (n === 0) return `<span class="pill p-bad">сегодня</span>`;
  if (n <= 3) return `<span class="pill p-bad">через ${n} дн.</span>`;
  if (n <= 7) return `<span class="pill p-warn">через ${n} дн.</span>`;
  return `<span class="pill p-ok">через ${n} дн.</span>`;
}

// ---------- расчёты ----------
function loanNext(){
  const L = S.loan; if (!L.payment || L.left <= 0) return null;
  const t = today(); const day = Math.min(28, Math.max(1, +L.day || 1));
  let d = new Date(t.getFullYear(), t.getMonth(), day);
  if (d < t) d = new Date(t.getFullYear(), t.getMonth() + 1, day);
  if (L.paid === iso(d)) d = new Date(d.getFullYear(), d.getMonth() + 1, day);
  return iso(d);
}
function calc(){
  const debt = S.cards.reduce((a, c) => a + num(c.debt), 0);
  const loan = num(S.loan.principal);
  const avail = S.balance - debt;
  const own = avail - loan;
  const env = S.envelopes.reduce((a, e) => a + num(e.amount), 0);
  const planned = S.plan.reduce((a, p) => a + num(p.amount), 0);
  const rate = S.banks.filter(b => b.on).reduce((a, b) => a + num(b.rate), 0);
  const perDay = S.balance * rate / 36500;
  const other = S.other.reduce((a, o) => a + num(o.amount), 0);
  return {debt, loan, credit: debt + loan, own, avail, env, planned, free: avail - env - planned, rate, perDay, other};
}
function events(days = 30){
  const out = [];
  for (const c of S.cards) {
    if (num(c.debt) > 0 && c.due) out.push({d: c.due, t: `${c.name}: погасить полностью`, s: num(c.debt)});
    if (num(c.min) > 0 && c.minDate) out.push({d: c.minDate, t: `${c.name}: минимальный платёж`, s: num(c.min)});
  }
  const ln = loanNext(); if (ln) out.push({d: ln, t: `${S.loan.name}: платёж`, s: num(S.loan.payment)});
  for (const p of S.plan) if (p.date) out.push({d: p.date, t: p.name, s: num(p.amount)});
  return out.filter(e => daysTo(e.d) <= days).sort((a, b) => a.d.localeCompare(b.d));
}

// ---------- экраны ----------
function render(){
  const A = document.getElementById("app");
  A.innerHTML = ({home, cards, env, plan, more})[tab]();
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
}
function home(){
  const c = calc(), ev = events(14);
  const freeCls = c.free < 0 ? "neg" : "pos";
  return `<h1>Мои деньги</h1>
  <form class="quick" onsubmit="event.preventDefault(); quickGo(this.q.value)">
    <input name="q" placeholder="Быстрая запись: еда 8000, косметика 3500…" autocomplete="off" enterkeyhint="go">
    <button class="btn" aria-label="Записать">→</button>
  </form>
  <div class="card hero">
    <div class="lbl">${c.free < 0 ? "Не хватает с учётом конвертов и плана" : "Можно тратить"}</div>
    <div class="big ${freeCls}">${rub(c.free < 0 ? -c.free : c.free)}</div>
    <div class="muted">накопительный минус кредитки, конверты и план. Кредит гасится частями из зарплаты</div>
  </div>
  <div class="card">
    <div class="row tap" onclick="opBalance()"><div class="l">Накопительный счёт<small>нажмите, чтобы сверить с банком</small></div><div class="r">${rub(S.balance)}</div></div>
    <div class="row tap" onclick="go('cards')"><div class="l">Кредитные деньги<small>кредитки ${rub(c.debt)} + кредит ${rub(c.loan)}</small></div><div class="r ${c.credit > 0 ? "neg" : ""}">${c.credit > 0 ? "−" + rub(c.credit) : rub(0)}</div></div>
    <div class="row"><div class="l"><b>Собственные</b>${c.own < 0 ? "<small>минус — уже потрачено из заёмных</small>" : ""}</div><div class="r ${c.own < 0 ? "neg" : "pos"}">${rub(c.own)}</div></div>
    ${c.other ? `<div class="row"><div class="l">С учётом других денег<small>вклады, наличные, брокерский, долги вам</small></div><div class="r ${c.own + c.other < 0 ? "neg" : ""}">${rub(c.own + c.other)}</div></div>` : ""}
  </div>
  <div class="card">
    <div class="row"><div class="l"><b>Свободно сейчас</b><small>накопительный минус кредитки</small></div><div class="r">${rub(c.avail)}</div></div>
    <div class="row tap" onclick="go('env')"><div class="l">Отложено в конвертах</div><div class="r">${c.env ? "−" + rub(c.env) : rub(0)}</div></div>
    <div class="row tap" onclick="go('plan')"><div class="l">Запланированные траты</div><div class="r">${c.planned ? "−" + rub(c.planned) : rub(0)}</div></div>
  </div>
  <div class="ops">
    <button onclick="opIncome('adv')"><b>+</b>Аванс / зарплата</button>
    <button onclick="opFood()"><b>🛒</b>Перевёл на еду</button>
    <button onclick="opSpend()"><b>−</b>Расход</button>
    <button onclick="opInterest()"><b>%</b>Проценты</button>
    <button onclick="opCashback()"><b>↺</b>Кэшбэк</button>
    <button onclick="opTake()"><b>↓</b>Снял с кредитки</button>
    <button onclick="opRepay()"><b>↑</b>Погасил кредитку</button>
    <button onclick="opMin()"><b>⇡</b>Мин. платёж</button>
    <button onclick="opEnvMove()"><b>✉</b>В конверт</button>
    <button onclick="opLoanPaid()"><b>₽</b>Платёж по кредиту</button>
    <button onclick="opBalance()"><b>✓</b>Сверка с банком</button>
    <button onclick="go('env')"><b>☷</b>Все конверты</button>
    <button onclick="S.loan.payment ? opPrepay() : go('more')"><b>⇣</b>Досрочно кредит</button>
  </div>
  ${foodEnv() ? `<div class="card tap" onclick="opFood()"><div class="row"><div class="l">🛒 Осталось на еду<small>до следующей выплаты · нажмите, когда переведёте на карту</small></div><div class="r ${num(foodEnv().amount) < 0 ? "neg" : ""}">${rub(foodEnv().amount)}</div></div></div>` : ""}
  <h2>Проценты</h2>
  <div class="card tap" onclick="go('more')">
    <div class="row"><div class="l">Ставка сейчас<small>${S.banks.filter(b => b.on).map(b => esc(b.name) + " " + b.rate + "%").join(" + ") || "банки не заданы"}</small></div><div class="r">${String(c.rate).replace(".", ",")}%</div></div>
    <div class="row"><div class="l">Примерный доход</div><div class="r pos">${rub(Math.round(c.perDay))}/день · ${rub(Math.round(c.perDay * 30))}/мес</div></div>
  </div>
  <h2>Ближайшие 14 дней</h2>
  <div class="card">${ev.length ? ev.map(e => `<div class="row"><div class="l">${esc(e.t)}<small>${dmy(e.d)} ${pill(e.d)}</small></div><div class="r">${rub(e.s)}</div></div>`).join("") : `<div class="empty">Платежей нет</div>`}</div>
  ${S.loan.payment ? `<div class="card tap" onclick="opLoanPaid()"><div class="row"><div class="l">${esc(S.loan.name)}<small>следующий ${dmy(loanNext())}, осталось платежей: ${S.loan.left}, долг ${rub(S.loan.principal)}</small></div><div class="r">${rub(S.loan.payment)}</div></div><div class="hint">Нажмите, когда внесёте платёж</div></div>` : ""}
  ${S.other.length ? `<h2>Другие деньги</h2><div class="card">${S.other.map(o => `<div class="row tap" onclick="editOther('${o.id}')"><div class="l">${esc(o.name)}</div><div class="r">${rub(o.amount)}</div></div>`).join("")}<div class="row"><div class="l muted">Не входят в «можно тратить»</div><div class="r">${rub(c.other)}</div></div></div>` : ""}`;
}
function cards(){
  const c = calc();
  return `<h1>Кредитки</h1>
  <div class="card hero"><div class="lbl">Общий долг</div><div class="big">${rub(c.debt)}</div>
  <div class="muted">Столько на накопительном — не ваши деньги</div></div>
  ${S.cards.map(k => {
    const p = k.limit ? Math.max(0, Math.min(100, num(k.debt) / num(k.limit) * 100)) : 0;
    return `<div class="card tap" onclick="editCard('${k.id}')">
      <div class="row"><div class="l"><b>${esc(k.name)}</b><small>${k.due && num(k.debt) > 0 ? "гасить до " + dmy(k.due) + " " + pill(k.due) : num(k.debt) > 0 ? "дата не указана" : num(k.debt) < 0 ? "долга нет, на карте ваши деньги" : "долга нет"}</small></div><div class="r ${num(k.debt) < 0 ? "pos" : ""}">${num(k.debt) < 0 ? "+" + rub(-k.debt) : rub(k.debt)}<small class="muted" style="display:block;font-weight:400">из ${rub(k.limit)}</small></div></div>
      ${num(k.min) > 0 && k.minDate ? `<div class="row"><div class="l">Минимальный платёж<small>до ${dmy(k.minDate)} ${pill(k.minDate)}</small></div><div class="r">${rub(k.min)}</div></div>` : ""}
      <div class="bar"><i style="width:${p}%"></i></div></div>`;
  }).join("") || `<div class="card empty">Карт пока нет</div>`}
  <button class="btn wide" onclick="editCard()">Добавить карту</button>`;
}
function env(){
  const c = calc();
  return `<h1>Конверты</h1>
  <div class="card hero"><div class="lbl">Отложено всего</div><div class="big">${rub(c.env)}</div>
  <div class="muted">Деньги лежат на накопительном, но уже не входят в «можно тратить»</div></div>
  ${S.envelopes.map(e => {
    const p = e.target ? Math.min(100, num(e.amount) / num(e.target) * 100) : 0;
    return `<div class="card tap" onclick="openEnv('${e.id}')">
      <div class="row"><div class="l"><b>${esc(e.name)}</b><small>${e.monthly ? "+" + rub(e.monthly) + " в месяц " + SRC[e.from || ""] : "вручную"}${e.target ? " · цель " + rub(e.target) + (num(e.amount) >= num(e.target) ? " ✓" : "") : ""}${e.due ? " · к " + dmy(e.due) : ""}</small></div><div class="r">${rub(e.amount)}</div></div>
      ${e.target ? `<div class="bar"><i style="width:${p}%"></i></div>` : ""}</div>`;
  }).join("") || `<div class="card empty">Создайте конверт: «Подушка», «Отпуск», «Подарки»…</div>`}
  ${S.envelopes.some(e => e.monthly) ? `<div class="card"><div class="row"><div class="l">С аванса в конверты</div><div class="r">${rub(shares("adv").reduce((a, x) => a + x[1], 0))}</div></div><div class="row"><div class="l">С зарплаты в конверты</div><div class="r">${rub(shares("sal").reduce((a, x) => a + x[1], 0))}</div></div></div>` : ""}
  <button class="btn wide" onclick="editEnv()">Новый конверт</button>`;
}
function plan(){
  const c = calc();
  return `<h1>План трат</h1>
  <div class="card hero"><div class="lbl">Запланировано</div><div class="big">${rub(c.planned)}</div>
  <div class="muted">Уже вычтено из «можно тратить»</div></div>
  <div class="card">${S.plan.slice().sort((a, b) => (a.date || "9").localeCompare(b.date || "9")).map(p => `<div class="row tap" onclick="openPlan('${p.id}')"><div class="l">${esc(p.name)}<small>${p.date ? dmy(p.date) + " " + pill(p.date) : "без даты"}</small></div><div class="r">${rub(p.amount)}</div></div>`).join("") || `<div class="empty">Плановых трат нет</div>`}</div>
  <button class="btn wide" onclick="editPlan()">Добавить трату</button>`;
}
function more(){
  return `<h1>Ещё</h1>
  <h2>Ставки накопительных счетов</h2>
  <div class="card">${S.banks.map(b => `<div class="row tap" onclick="editBank('${b.id}')"><div class="l">${esc(b.name)}<small>${b.on ? "начисляет" : "выключен"}</small></div><div class="r">${String(b.rate).replace(".", ",")}%</div></div>`).join("")}
  <div class="hint">Если деньги за день получают проценты в нескольких банках, включите все — ставки сложатся.</div></div>
  <button class="btn sec wide" onclick="editBank()">Добавить банк</button>
  <h2>Кредит</h2>
  <div class="card tap" onclick="editLoan()"><div class="row"><div class="l">${esc(S.loan.name)}<small>${S.loan.payment ? S.loan.day + "-го числа, осталось " + S.loan.left + " платежей · долг " + rub(S.loan.principal) : "не задан"}</small></div><div class="r">${rub(S.loan.payment)}</div></div></div>
  ${S.loan.payment ? `<button class="btn sec wide" onclick="opPrepay()">Досрочно погасить</button>` : ""}
  <h2>Другие деньги</h2>
  <div class="card">${S.other.map(o => `<div class="row tap" onclick="editOther('${o.id}')"><div class="l">${esc(o.name)}</div><div class="r">${rub(o.amount)}</div></div>`).join("") || `<div class="empty">Вклады, наличные, долги вам</div>`}</div>
  <button class="btn sec wide" onclick="editOther()">Добавить</button>
  <h2>История</h2>
  <div class="card">${S.log.slice(0, 40).map(l => `<div class="row"><div class="l">${esc(l.text)}<small>${new Date(l.t).toLocaleString("ru-RU", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"})}</small></div><div class="r ${l.delta < 0 ? "neg" : l.delta > 0 ? "pos" : ""}">${l.delta ? rub(l.delta, true) : ""}</div></div>`).join("") || `<div class="empty">Пока пусто</div>`}</div>

  <div class="btns"><button class="btn sec" onclick="exportData()">Сохранить копию</button><button class="btn sec" onclick="document.getElementById('imp').click()">Загрузить копию</button></div>

}

// ---------- окна ----------
function sheet(title, body, onOk, okText = "Готово", extra = ""){
  const el = document.getElementById("sheetIn");
  el.innerHTML = `<h3>${title}</h3><form id="f">${body}<div class="btns" style="margin-top:16px"><button type="button" class="btn sec" onclick="closeSheet()">Отмена</button><button class="btn">${okText}</button></div>${extra}</form>`;
  document.getElementById("sheet").classList.add("on");
  document.getElementById("f").onsubmit = ev => {
    ev.preventDefault();
    const v = Object.fromEntries(new FormData(ev.target));
    document.querySelectorAll("#f input[type=checkbox]").forEach(x => v[x.name] = x.checked);
    if (onOk(v) !== false) { save(); closeSheet(); render(); }
  };
  const first = el.querySelector("input:not([type=checkbox]),select"); if (first && !first.value) setTimeout(() => first.focus(), 250);
}
function closeSheet(){ document.getElementById("sheet").classList.remove("on"); }
document.getElementById("sheet").onclick = e => { if (e.target.id === "sheet") closeSheet(); };
const inp = (name, lbl, val = "", type = "text", attrs = "") =>
  `<label>${lbl}</label><input name="${name}" type="${type}" value="${esc(val)}" ${type === "num" ? 'inputmode="decimal"' : ""} ${attrs}>`.replace('type="num"', 'type="text"');
const sel = (name, lbl, opts, val) => `<label>${lbl}</label><select name="${name}">${opts.map(([v, t]) => `<option value="${v}" ${v === val ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>`;
const envOpts = (first) => [["", first], ...S.envelopes.map(e => [e.id, e.name + " · " + rub(e.amount)])];
const cardOpts = () => S.cards.map(c => [c.id, c.name + " · долг " + rub(c.debt)]);
function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.classList.add("on"); setTimeout(() => el.classList.remove("on"), 1800); }
function go(t){ tab = t; render(); scrollTo(0, 0); }
function delBtn(fn){ return `<button type="button" class="btn danger wide" style="margin-top:10px" onclick="${fn}">Удалить</button>`; }

// ---------- операции ----------
const SRC = {adv: "с аванса", sal: "с зарплаты", both: "пополам с аванса и зарплаты", "": "вручную"};
function shares(kind){
  return S.envelopes.map(e => [e, e.from === kind ? num(e.monthly) : e.from === "both" ? num(e.monthly) / 2 : 0]).filter(x => x[1] > 0);
}
function opIncome(kind){
  kind = kind || "adv";
  const preview = k => { const sh = shares(k); const t = sh.reduce((a, x) => a + x[1], 0);
    return sh.length ? `<div class="card" style="margin-top:12px">${sh.map(([e, a]) => `<div class="row"><div class="l">${esc(e.name)}</div><div class="r">${rub(a)}</div></div>`).join("")}<div class="row"><div class="l"><b>Всего в конверты</b></div><div class="r">${rub(t)}</div></div></div>` : `<div class="hint">Конвертов с суммой «в месяц» пока нет.</div>`; };
  sheet("Доход", sel("k", "Что пришло", [["adv", "Аванс"], ["sal", "Зарплата"], ["other", "Другое"]], kind) + inp("s", "Сумма", "", "num") +
    `<label class="sw">Разложить по конвертам по плану<input type="checkbox" name="split" ${kind === "other" ? "" : "checked"}></label><div id="pv">${preview(kind)}</div>`, v => {
    const s = num(v.s); if (!s) return false;
    S.balance += s;
    const name = {adv: "Аванс", sal: "Зарплата", other: "Доход"}[v.k];
    log(name, s);
    if (v.split && v.k !== "other") {
      const sh = shares(v.k), tot = sh.reduce((a, x) => a + x[1], 0);
      sh.forEach(([e, a]) => e.amount = num(e.amount) + a);
      log(`${name}: в конверты ${rub(tot)}, свободно ${rub(s - tot)}`, 0);
      toast(`В конверты ${rub(tot)}, свободно ${rub(s - tot)}`);
    } else toast("Добавлено " + rub(s));
  });
  setTimeout(() => { const k = document.querySelector("#f select[name=k]"); if (k) k.onchange = () => { document.getElementById("pv").innerHTML = preview(k.value); }; }, 0);
}
function foodEnv(){ return S.envelopes.find(e => e.name.trim().toLowerCase() === "еда"); }
function opFood(){
  const e = foodEnv();
  if (!e) { toast("Создайте конверт «Еда»"); return go("env"); }
  sheet("🛒 Перевёл на еду", `<div class="hint">В конверте «Еда» сейчас ${rub(e.amount)}. Сумма уйдёт с накопительного на карту для еды.</div>` +
    inp("s", "Сколько перевёл", "8000", "num") + inp("t", "Комментарий (необязательно)", ""), v => {
    const s = num(v.s); if (!s) return false;
    S.balance -= s; e.amount = num(e.amount) - s;
    log("Перевёл на еду" + (v.t ? " — " + v.t : ""), -s);
    toast(e.amount < 0 ? `Перерасход по еде: ${rub(-e.amount)}` : `В конверте «Еда» осталось ${rub(e.amount)}`);
  }, "Перевёл");
}
function opSpend(){
  sheet("Расход с накопительного", inp("s", "Сумма", "", "num") + inp("t", "На что", "") + sel("e", "Из конверта", envOpts("Из свободных денег"), ""), v => {
    const s = num(v.s); if (!s) return false;
    S.balance -= s;
    const e = S.envelopes.find(x => x.id === v.e); if (e) e.amount = Math.max(0, num(e.amount) - s);
    log((v.t || "Расход") + (e ? " (из «" + e.name + "»)" : ""), -s);
  });
}
function opInterest(){
  sheet("Пришли проценты", inp("s", "Сумма", "", "num") + sel("b", "Банк", S.banks.map(b => [b.name, b.name]), S.banks[0]?.name), v => {
    const s = num(v.s); if (!s) return false;
    S.balance += s; log("Проценты " + (v.b || ""), s);
  });
}
function opCashback(){
  const where = [["sav", "На личный счёт (переведу на накопительный) — свободные деньги"], ...S.cards.map(c => ["card:" + c.id, `На кредитку «${c.name}» — уменьшит долг`]),
                 ...S.envelopes.map(e => ["env:" + e.id, `На накопительный → в конверт «${e.name}»`])];
  sheet("Пришёл кэшбэк", inp("s", "Сумма", "", "num") + sel("w", "Куда пришёл", where, "sav") + inp("t", "С какой карты / за что (необязательно)", "") +
    `<div class="hint">Кэшбэк на личный счёт — ваши свои деньги. Переведите его на накопительный, чтобы на него шли проценты: тогда остаток в приложении сойдётся с банком.</div>`, v => {
    const s = num(v.s); if (!s) return false;
    applyCashback(s, v.w, v.t);
    toast("Кэшбэк " + rub(s) + " записан");
  }, "Записать");
}
function applyCashback(s, w, t){
  const note = t ? " — " + t : "";
  if (w.startsWith("card:")) {
    const c = S.cards.find(x => x.id === w.slice(5));
    c.debt = Math.round((num(c.debt) - s) * 100) / 100;
    log(`Кэшбэк на «${c.name}»${note} (долг меньше)`, 0);
  } else {
    S.balance += s;
    const e = w.startsWith("env:") ? S.envelopes.find(x => x.id === w.slice(4)) : null;
    if (e) e.amount = num(e.amount) + s;
    log("Кэшбэк" + (e ? ` → «${e.name}»` : "") + note, s);
  }
}
function opBalance(){
  sheet("Сверка с банком", inp("s", "Точный остаток на накопительном", String(S.balance).replace(".", ","), "num") +
    `<div class="hint">Если цифры разошлись с банком — впишите остаток из приложения банка. Разница попадёт в историю.</div>`, v => {
    const s = num(v.s), d = s - S.balance; S.balance = s;
    if (Math.abs(d) > 0.004) log("Сверка остатка", d);
  }, "Сохранить");
}
function opTake(){
  if (!S.cards.length) { toast("Сначала добавьте карту"); return go("cards"); }
  sheet("Снял с кредитки → на накопительный", sel("c", "Карта", cardOpts(), S.cards[0].id) + inp("s", "Сумма", "", "num") +
    inp("due", "Конец льготного периода (если изменился)", "", "date"), v => {
    const c = S.cards.find(x => x.id === v.c), s = num(v.s); if (!s) return false;
    c.debt = num(c.debt) + s; S.balance += s; if (v.due) c.due = v.due;
    log(`Снял с «${c.name}»`, s);
  });
}
function opRepay(){
  if (!S.cards.length) { toast("Карт нет"); return; }
  const c0 = S.cards.find(c => num(c.debt) > 0) || S.cards[0];
  sheet("Погасил кредитку с накопительного", sel("c", "Карта", cardOpts(), c0.id) + inp("s", "Сумма", String(c0.debt).replace(".", ","), "num") +
    inp("due", "Новый конец льготного периода (если знаете)", "", "date"), v => {
    const c = S.cards.find(x => x.id === v.c), s = num(v.s); if (!s) return false;
    c.debt = Math.round((num(c.debt) - s) * 100) / 100; S.balance -= s;
    if (num(c.min) > 0 && s >= num(c.min)) { c.min = 0; c.minDate = ""; }
    c.due = v.due || (c.debt > 0 ? c.due : "");
    log(`Погасил «${c.name}»`, -s);
  });
  setTimeout(() => { const f = document.querySelector("#f select[name=c]"); if (f) f.onchange = () => { document.querySelector("#f input[name=s]").value = String(S.cards.find(x => x.id === f.value).debt).replace(".", ","); }; }, 0);
}
function opMin(){
  if (!S.cards.length) { toast("Карт нет"); return; }
  const c0 = S.cards.find(c => num(c.min) > 0) || S.cards[0];
  sheet("Минимальный платёж с накопительного", sel("c", "На какую карту", cardOpts(), c0.id) + inp("s", "Сумма", String(c0.min || "").replace(".", ","), "num") +
    `<div class="hint">Сумма уйдёт с накопительного и уменьшит долг карты. Минимальный платёж отметится оплаченным.</div>`, v => {
    const c = S.cards.find(x => x.id === v.c), s = num(v.s); if (!s) return false;
    c.debt = Math.round((num(c.debt) - s) * 100) / 100; S.balance -= s;
    c.min = 0; c.minDate = "";
    log(`Мин. платёж «${c.name}»`, -s);
  }, "Внёс");
  setTimeout(() => { const f = document.querySelector("#f select[name=c]"); if (f) f.onchange = () => { document.querySelector("#f input[name=s]").value = String(S.cards.find(x => x.id === f.value).min || "").replace(".", ","); }; }, 0);
}
function opLoanPaid(){
  if (!S.loan.payment) { toast("Сначала задайте кредит в «Ещё»"); return go("more"); }
  sheet("Платёж по кредиту", `<div class="hint">Отметить платёж ${rub(S.loan.payment)} за ${dmy(loanNext())}?</div>` +
    sel("from", "Откуда платите", [["sav", "С накопительного (из конверта «Кредит», если есть)"], ["salary", "С другой карты (накопительный не трогаем)"]], "sav"), v => {
    const ke = S.envelopes.find(e => e.name.trim().toLowerCase() === "кредит");
    if (v.from === "sav" && ke) ke.amount = num(ke.amount) - num(S.loan.payment);
    const pr = num(S.loan.principal);
    if (pr) S.loan.principal = Math.max(0, Math.round((pr - (num(S.loan.payment) - pr * num(S.loan.rate) / 1200)) * 100) / 100);
    S.loan.paid = loanNext(); S.loan.left = Math.max(0, S.loan.left - 1);
    if (v.from === "sav") S.balance -= num(S.loan.payment);
    log(S.loan.name + ": платёж", v.from === "sav" ? -num(S.loan.payment) : 0);
  }, "Внёс");
}
function opPrepay(){
  sheet("Досрочное погашение кредита", inp("s", "Сумма", "", "num") +
    sel("from", "Откуда", [["sav", "С накопительного"], ["salary", "С другой карты (накопительный не трогаем)"]], "sav") +
    `<div class="hint">Остаток долга сейчас ${rub(S.loan.principal)}. После погашения сверьте точный остаток с банком в «Ещё → Кредит».</div>`, v => {
    const s = num(v.s); if (!s) return false;
    S.loan.principal = Math.max(0, num(S.loan.principal) - s);
    if (v.from === "sav") S.balance -= s;
    log(S.loan.name + ": досрочно", v.from === "sav" ? -s : 0);
  }, "Погасил");
}
function opEnvMove(){
  if (!S.envelopes.length) { toast("Сначала создайте конверт"); return go("env"); }
  openEnv(S.envelopes[0].id);
}

// ---------- редактирование ----------
function editCard(id){
  const c = S.cards.find(x => x.id === id) || {name: "", limit: "", debt: "", due: "", min: "", minDate: ""};
  sheet(id ? "Карта" : "Новая карта", inp("name", "Название", c.name, "text", 'placeholder="Например, Альфа 1"') +
    `<div class="grid2"><div>${inp("limit", "Лимит", c.limit, "num")}</div><div>${inp("debt", "Долг (минус — свои деньги на карте)", c.debt, "num")}</div></div>` +
    inp("due", "Конец льготного периода", c.due, "date") +
    `<div class="grid2"><div>${inp("min", "Мин. платёж", c.min || "", "num")}</div><div>${inp("minDate", "Его дата", c.minDate, "date")}</div></div>` +
    `<div class="hint">Долг здесь меняется вручную, без движения денег. Для снятия и погашения — кнопки на главной.</div>`, v => {
    if (!v.name) return false;
    Object.assign(c, {name: v.name, limit: num(v.limit), debt: num(v.debt), due: v.due, min: num(v.min), minDate: v.minDate});
    if (!id) { c.id = uid(); S.cards.push(c); }
  }, "Сохранить", id ? delBtn(`delItem('cards','${id}')`) : "");
}
function editEnv(id){
  const e = S.envelopes.find(x => x.id === id) || {name: "", target: "", amount: 0, monthly: "", from: "adv", due: ""};
  sheet(id ? "Конверт" : "Новый конверт", inp("name", "Название", e.name, "text", 'placeholder="Подушка, Отпуск, Подарки…"') +
    `<div class="grid2"><div>${inp("monthly", "Откладывать в месяц", e.monthly || "", "num")}</div><div>${sel("from", "Откуда", Object.entries(SRC), e.from || "")}</div></div>` +
    `<div class="grid2"><div>${inp("target", "Цель (необязательно)", e.target || "", "num")}</div><div>${inp("due", "Нужно к дате", e.due || "", "date")}</div></div>` +
    (id ? inp("amount", "Сейчас в конверте", String(e.amount).replace(".", ","), "num") : inp("amount", "Отложить сразу", "", "num")), v => {
    if (!v.name) return false;
    e.name = v.name; e.target = num(v.target); e.monthly = num(v.monthly); e.from = v.from; e.due = v.due;
    if (id && num(v.amount) !== num(e.amount)) { log(`Конверт «${e.name}»: исправлено ${rub(e.amount)} → ${rub(num(v.amount))}`, 0); e.amount = num(v.amount); }
    if (!id) { e.id = uid(); e.amount = num(v.amount); S.envelopes.push(e); if (e.amount) log(`В конверт «${e.name}»`, 0); }
  }, "Сохранить", id ? delBtn(`delItem('envelopes','${id}')`) : "");
}
function openEnv(id){
  const e = S.envelopes.find(x => x.id === id);
  sheet("✉ " + esc(e.name) + " · " + rub(e.amount), sel("e", "Конверт", S.envelopes.map(x => [x.id, x.name + " · " + rub(x.amount)]), id) +
    sel("act", "Что сделать", [["put", "Отложить в конверт"], ["take", "Вернуть в свободные"], ["spend", "Потратить из конверта"]], "put") + inp("s", "Сумма", "", "num") +
    `<div class="hint">«Отложить» не двигает деньги в банке — просто помечает их как занятые. «Потратить» уменьшает и конверт, и накопительный.</div>`, v => {
    const x = S.envelopes.find(y => y.id === v.e), s = num(v.s); if (!s) return false;
    if (v.act === "put") { x.amount = num(x.amount) + s; log(`Отложил в «${x.name}»`, 0); }
    if (v.act === "take") { x.amount = Math.max(0, num(x.amount) - s); log(`Вернул из «${x.name}»`, 0); }
    if (v.act === "spend") { x.amount = Math.max(0, num(x.amount) - s); S.balance -= s; log(`Потратил из «${x.name}»`, -s); }
  }, "Готово", `<button type="button" class="btn sec wide" style="margin-top:10px" onclick="closeSheet();editEnv(document.querySelector('#f select[name=e]').value)">Переименовать / цель / удалить</button>`);
}

}
function delItem(kind, id){
  S[kind] = S[kind].filter(x => x.id !== id); save(); closeSheet(); render(); toast("Удалено");
}

// ---------- быстрая запись: разбор фразы прямо в телефоне ----------
const norm = x => String(x).toLowerCase().replace(/ё/g, "е").replace(/[\s\-–—«»"]/g, "");
function findCard(t){
  const n = norm(t);
  let best = null;
  for (const c of S.cards) { const k = norm(c.name); if (k && n.includes(k) && (!best || k.length > norm(best.name).length)) best = c; }
  if (!best) for (const c of S.cards) { const k = norm(c.name).replace(/банк/, ""); if (k.length >= 3 && n.includes(k)) return c; }
  return best;
}
function findEnv(t){
  const n = norm(t);
  let best = null;
  for (const e of S.envelopes) {
    const words = e.name.toLowerCase().replace(/ё/g, "е").split(/[^а-яa-z0-9]+/).filter(w => w.length >= 4);
    const full = norm(e.name);
    const hit = n.includes(full) || words.some(w => n.includes(norm(w).slice(0, Math.max(4, w.length - 2))));
    if (hit && (!best || full.length > norm(best.name).length)) best = e;
  }
  return best;
}
function parseQuick(q){
  let raw = q.trim(); if (!raw) return null;
  // название карты с цифрой («райф 1») не должно попасть в сумму — вырезаем его до поиска суммы
  const c0 = findCard(raw);
  const cardTxt = c0 ? (raw.match(new RegExp(c0.name.replace(/\s+/g, "").split("").map(ch => ch.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("[\\s\\-]*"), "i")) || [""])[0] : "";
  const rawNoCard = cardTxt ? raw.replace(cardTxt, " ") : raw;
  // сумма — последнее число; пробелы внутри допускаются только как разделители тысяч («73 950», «1 000 000»)
  const m = rawNoCard.match(/(\d{1,3}(?:[ \u00a0]\d{3})+(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?)\s*(?:р|₽|руб\.?|рублей)?\s*$/i);
  const amount = m ? num(m[1]) : 0;
  const text = (m ? rawNoCard.replace(m[0], " ") : rawNoCard).trim() + (cardTxt ? " " + cardTxt : "");
  const t = text.toLowerCase().replace(/ё/g, "е");
  const has = re => re.test(t);
  if (has(/^(аванс)/)) return {kind: "income", sub: "adv", amount, label: `Аванс ${rub(amount)} → разложить по конвертам`};
  if (has(/^(зарплата|зп|получка)/)) return {kind: "income", sub: "sal", amount, label: `Зарплата ${rub(amount)} → разложить по конвертам`};
  if (has(/^(доход|пришло|пришли|вернули|\+)/)) return {kind: "income", sub: "other", amount, text, label: `Доход ${rub(amount)} на накопительный`};
  if (has(/^(кэшбэк|кешбэк|кэшбек|кешбек|cashback|кб)/)) {
    const card = findCard(t);
    return {kind: "cashback", card, amount, label: card ? `Кэшбэк ${rub(amount)} на «${card.name}» — долг уменьшится` : `Кэшбэк ${rub(amount)} в свободные деньги`};
  }
  if (has(/^(проценты|процент|%)/)) return {kind: "interest", amount, label: `Проценты ${rub(amount)} на накопительный`};
  if (has(/^(сверка|остаток|баланс)/)) return {kind: "bal", amount, label: `Точный остаток накопительного: ${rub(amount)}`};
  if (has(/^(досрочно|досрочка)/)) return {kind: "prepay", amount, label: `Досрочно в кредит ${rub(amount)} с накопительного`};
  if (has(/^(кредит|платеж по кредиту|платеж кредит)/) && !findCard(t)) return {kind: "loan", amount: num(S.loan.payment), label: `Платёж по кредиту ${rub(S.loan.payment)} (из конверта «Кредит»)`};
  const card = findCard(t);
  if (card && has(/^(снял|сняла|взял|сняли)/)) return {kind: "take", card, amount, label: `Снял с «${card.name}» ${rub(amount)} → на накопительный`};
  if (card && has(/^(мин|минималк|минимальн)/)) return {kind: "min", card, amount: amount || num(card.min), label: `Мин. платёж «${card.name}» ${rub(amount || card.min)} с накопительного`};
  if (card && has(/^(погасил|погасила|гашу|погашение|внес|внесла)/)) return {kind: "repay", card, amount: amount || num(card.debt), label: `Погасил «${card.name}» ${rub(amount || card.debt)} с накопительного`};
  if (has(/^(в |отложил|отложила|отложить)/)) { const e = findEnv(t.replace(/^(в |отложил[а]? в |отложить в |отложил[а]? )/, "")); if (e) return {kind: "put", env: e, amount, label: `Отложить в «${e.name}» ${rub(amount)}`}; }
  if (has(/^(еда|на еду|продукты|перевел на еду|перевела на еду)/)) { const e = foodEnv(); return {kind: "food", env: e, amount, label: `Перевёл на еду ${rub(amount)}` + (e ? ` (в конверте останется ${rub(num(e.amount) - amount)})` : "")}; }
  const e = findEnv(t);
  if (e) return {kind: "spend", env: e, amount, text, label: `Расход из конверта «${e.name}»: ${rub(amount)}` + ` (останется ${rub(num(e.amount) - amount)})`};
  return {kind: "spend", env: null, amount, text, label: `Расход «${text || "без названия"}» ${rub(amount)} из свободных денег`};
}
function applyQuick(r){
  const s = r.amount;
  switch (r.kind) {
    case "income": {
      S.balance += s; const name = {adv: "Аванс", sal: "Зарплата", other: r.text || "Доход"}[r.sub]; log(name, s);
      if (r.sub !== "other") { const sh = shares(r.sub), tot = sh.reduce((a, x) => a + x[1], 0); sh.forEach(([e, a]) => e.amount = num(e.amount) + a); log(`${name}: в конверты ${rub(tot)}, свободно ${rub(s - tot)}`, 0); }
      break; }
    case "interest": S.balance += s; log("Проценты", s); break;
    case "cashback": applyCashback(s, r.card ? "card:" + r.card.id : "sav", ""); break;
    case "bal": { const d = s - S.balance; S.balance = s; if (Math.abs(d) > 0.004) log("Сверка остатка", d); break; }
    case "prepay": S.loan.principal = Math.max(0, num(S.loan.principal) - s); S.balance -= s; log(S.loan.name + ": досрочно", -s); break;
    case "loan": {
      const pr = num(S.loan.principal);
      if (pr) S.loan.principal = Math.max(0, Math.round((pr - (num(S.loan.payment) - pr * num(S.loan.rate) / 1200)) * 100) / 100);
      S.loan.paid = loanNext(); S.loan.left = Math.max(0, S.loan.left - 1); S.balance -= s;
      const ke = S.envelopes.find(e => norm(e.name) === "кредит"); if (ke) ke.amount = num(ke.amount) - s;
      log(S.loan.name + ": платёж", -s); break; }
    case "take": r.card.debt = num(r.card.debt) + s; S.balance += s; log(`Снял с «${r.card.name}»`, s); break;
    case "min": r.card.debt = Math.round((num(r.card.debt) - s) * 100) / 100; S.balance -= s; r.card.min = 0; r.card.minDate = ""; log(`Мин. платёж «${r.card.name}»`, -s); break;
    case "repay": r.card.debt = Math.round((num(r.card.debt) - s) * 100) / 100; S.balance -= s; if (num(r.card.min) > 0 && s >= num(r.card.min)) { r.card.min = 0; r.card.minDate = ""; } if (r.card.debt <= 0) r.card.due = ""; log(`Погасил «${r.card.name}»`, -s); break;
    case "put": r.env.amount = num(r.env.amount) + s; log(`Отложил в «${r.env.name}»`, 0); break;
    case "food": S.balance -= s; if (r.env) r.env.amount = num(r.env.amount) - s; log("Перевёл на еду", -s); break;
    case "spend": S.balance -= s; if (r.env) r.env.amount = num(r.env.amount) - s; log((r.text || "Расход") + (r.env ? ` (из «${r.env.name}»)` : ""), -s); break;
  }
}
function quickGo(q){
  const r = parseQuick(q);
  if (!r) return;
  if (!r.amount && !["loan"].includes(r.kind)) { toast("Добавьте сумму, например: еда 8000"); return; }
  const kinds = [["spend", "Расход"], ["food", "Перевёл на еду"], ["income", "Доход"], ["interest", "Проценты"], ["take", "Снял с кредитки"], ["repay", "Погасил кредитку"], ["min", "Мин. платёж"], ["put", "Отложить в конверт"], ["loan", "Платёж по кредиту"], ["prepay", "Досрочно кредит"], ["bal", "Сверка остатка"]];
  sheet("Записать?", `<div class="card"><div class="qrow"><b>${esc(r.label)}</b></div></div>
    <div class="hint">Понял не так? Нажмите «Отмена» и запишите кнопками или уточните фразу: «снял альфа 1 50000», «погасил райф 2 100000», «мин райф 1 3000», «в подушку 5000», «аванс 70000», «проценты 590».</div>`, () => {
    applyQuick(r);
    toast("Записано");
    const f = document.querySelector(".quick input"); if (f) f.value = "";
  }, "Записать");
}

// ---------- копия ----------
function exportData(){
  const blob = new Blob([JSON.stringify(S, null, 1)], {type: "application/json"});
  const name = "money-" + iso(new Date()) + ".json";
  const file = new File([blob], name, {type: "application/json"});
  if (navigator.canShare && navigator.canShare({files: [file]})) { navigator.share({files: [file]}).catch(() => {}); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}
function importData(el){
  const f = el.files[0]; if (!f) return;
  f.text().then(t => {
    const d = JSON.parse(t);
    if (d.template === "envelopes" && Array.isArray(d.envelopes)) {
      let add = 0, upd = 0;
      for (const n of d.envelopes) {
        const ex = S.envelopes.find(e => e.name.trim().toLowerCase() === n.name.trim().toLowerCase());
        if (ex) {
          Object.assign(ex, {monthly: n.monthly ?? ex.monthly, from: n.from ?? ex.from, target: n.target || ex.target, due: n.due || ex.due});
          if (n.amount !== undefined && num(n.amount) !== num(ex.amount)) { log(`Ребалансировка «${ex.name}»: ${rub(ex.amount)} → ${rub(n.amount)}`, 0); ex.amount = num(n.amount); }
          upd++;
        } else { S.envelopes.push({id: uid(), amount: 0, ...n, amount: num(n.amount || 0)}); if (n.amount) log(`Новый конверт «${n.name}»: ${rub(n.amount)}`, 0); add++; }
      }
      save(); render(); toast(`Конверты: добавлено ${add}, обновлено ${upd}`); return;
    }
    if (typeof d.balance !== "number" || !Array.isArray(d.cards)) throw 0;
    S = Object.assign(blank(), d); save(); render(); toast("Данные загружены");
  }).catch(() => toast("Это не файл копии"));
  el.value = "";
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => go(b.dataset.t));
load(); if (["home","cards","env","plan","more"].includes(location.hash.slice(1))) tab = location.hash.slice(1); render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
